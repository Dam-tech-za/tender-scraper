[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-scout"
version = "0.1.0"
description = "Automated South African public tender discovery for Damtech (waterproofing, dam lining, water storage and civil works)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
tender-scout = "tender_scout.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = ["live: hits the public internet (run with TENDER_SCOUT_LIVE=1)"]

[tool.setuptools.package-data]
tender_scout = ["*.html"]
