name: tenders

on:
  schedule:
    # Times are UTC. South Africa is UTC+2 all year.
    - cron: "30 4 * * 1-5"   # 06:30 SAST weekdays: scrape + morning email
    - cron: "0 11 * * *"     # 13:00 SAST daily: scrape only (dashboard refresh)
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the email digest after scraping"
        type: boolean
        default: false

concurrency:
  group: tenders
  cancel-in-progress: false

permissions:
  contents: write   # commit data/state.json + data/tenders.json back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TENDER_SCOUT_ENV: github
      TENDER_SCOUT_LOG_LEVEL: INFO
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Scrape eTenders
        run: python -m tender_scout scrape

      - name: Build dashboard
        run: python -m tender_scout dashboard --out site

      - name: Send morning digest
        if: github.event.schedule == '30 4 * * 1-5' || inputs.send_digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m tender_scout digest --send

      - name: Save state
        if: always()
        run: |
          git config user.name "tender-scout"
          git config user.email "tender-scout@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update tender data $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi

      - name: Keep dashboard as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-dashboard
          path: site/index.html
          retention-days: 7

      - name: Package dashboard for GitHub Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: scrape
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
